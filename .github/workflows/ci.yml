name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Docker image builds
        run: docker build -t koffeinkonto:ci .
      - name: Shellcheck deploy script
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:stable shellcheck scripts/deploy-remote.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # Marks the validated commit as releasable. The VPS deploys whatever is on
  # `release` through its webhook deployer (VPS-Proxy repo, deploy/README.md);
  # nothing in this workflow can reach the VPS.
  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # git refuses to push over a ref whose current commit it has never seen
      - run: git push origin HEAD:refs/heads/release
